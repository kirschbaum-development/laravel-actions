on: push
name: CI

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    strategy:
      fail-fast: true
      matrix:
        php: [ 8.0, 8.1, 8.2, 8.3, 8.4 ]
        laravel: [ 7.*, 8.*, 9.*, 10.*, 11.*, 12.* ]
        include:
          - php: 8.0
            laravel: 7.*
            phpunit: 9.*
            testbench: 5.*
            larastan: 1.*
          - php: 8.0
            laravel: 8.*
            phpunit: 9.*
            testbench: 6.*
            larastan: 1.*
          - php: 8.0
            laravel: 9.*
            phpunit: 9.*
            testbench: 7.*
            larastan: 2.*

          - php: 8.1
            laravel: 8.*
            phpunit: 9.*
            testbench: 6.*
            larastan: 1.*
          - php: 8.1
            laravel: 9.*
            phpunit: 9.*
            testbench: 7.*
            larastan: 2.*
          - php: 8.1
            laravel: 10.*
            phpunit: 10.*
            testbench: 8.*
            larastan: 2.*

          - php: 8.2
            laravel: 8.*
            phpunit: 9.*
            testbench: 6.*
            larastan: 1.*
          - php: 8.2
            laravel: 9.*
            phpunit: 9.*
            testbench: 7.*
            larastan: 2.*
          - php: 8.2
            laravel: 10.*
            phpunit: 10.*
            testbench: 8.*
            larastan: 2.*
          - php: 8.2
            laravel: 11.*
            phpunit: 10.*
            testbench: 9.*
            larastan: 2.*
          - php: 8.2
            laravel: 12.*
            phpunit: 11.*
            testbench: 10.*
            larastan: 3.*

          - php: 8.3
            laravel: 8.*
            phpunit: 9.*
            testbench: 6.*
            larastan: 1.*
          - php: 8.3
            laravel: 9.*
            phpunit: 9.*
            testbench: 7.*
            larastan: 2.*
          - php: 8.3
            laravel: 10.*
            phpunit: 10.*
            testbench: 8.*
            larastan: 2.*
          - php: 8.3
            laravel: 11.*
            phpunit: 11.*
            testbench: 9.*
            larastan: 2.*
          - php: 8.3
            laravel: 12.*
            phpunit: 11.*
            testbench: 10.*
            larastan: 3.*

          - php: 8.4
            laravel: 8.*
            phpunit: 9.*
            testbench: 6.*
            larastan: 1.*
          - php: 8.4
            laravel: 9.*
            phpunit: 9.*
            testbench: 7.*
            larastan: 2.*
          - php: 8.4
            laravel: 10.*
            phpunit: 10.*
            testbench: 8.*
            larastan: 2.*
          - php: 8.4
            laravel: 11.*
            phpunit: 11.*
            testbench: 9.*
            larastan: 2.*
          - php: 8.4
            laravel: 12.*
            phpunit: 11.*
            testbench: 10.*
            larastan: 3.*

        exclude:
          - php: 8.0
            laravel: 10.*
          - php: 8.0
            laravel: 11.*
          - php: 8.0
            laravel: 12.*
          - php: 8.1
            laravel: 7.*
          - php: 8.1
            laravel: 11.*
          - php: 8.1
            laravel: 12.*
          - php: 8.2
            laravel: 7.*
          - php: 8.3
            laravel: 7.*
          - php: 8.4
            laravel: 7.*

    name: Laravel Actions Tests - PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: dependencies-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zip, pcntl, iconv
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer require "larastan/larastan:${{ matrix.larastan }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction
          composer dump

      - name: Execute tests
        run: vendor/bin/phpunit tests/

  pint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    name: Pint Style Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: dependencies-composer-${{ hashFiles('composer.json') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer install --no-interaction
          composer dump

      - name: Execute Pint
        run: composer pint-check
